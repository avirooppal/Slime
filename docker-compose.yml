name: slime-demo
services:
  web:
    image: python:3.12-alpine
    labels: {org.slime.demo: "v1"}
    command: ["python", "-m", "http.server", "8000", "--directory", "/site"]
    volumes:
      - ./docs/demo:/site:ro
    networks: [demo]
  worker:
    image: python:3.12-alpine
    labels: {org.slime.demo: "v1"}
    command: ["python", "-m", "http.server", "8000", "--directory", "/site"]
    ports: ["127.0.0.1:18081:8000"]
    volumes:
      - ./docs/demo:/site:ro
    networks: [demo]
  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:18080:80"]
    volumes:
      - ./docs/demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web]
    networks: [demo]
networks:
  demo: {}
