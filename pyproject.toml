[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfheal"
version = "0.1.0"
description = "Slime: local-first, safety-first DevOps incident agent"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9", "pydantic>=2,<3", "PyYAML>=6", "rich>=13", "httpx>=0.27", "watchdog>=4", "typer>=0.12", "drain3>=0.9.11,<0.10", "rank_bm25>=0.2.2"]

[project.optional-dependencies]
docker = ["docker>=7,<8"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
embed = ["sentence-transformers>=3"]
laya = ["laya"]
cloud = []
dev = ["pytest>=8", "ruff", "mypy", "types-PyYAML", "types-psutil"]

[project.scripts]
selfheal = "selfheal.interface.cli:app"

[tool.setuptools.packages.find]
include = ["selfheal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

