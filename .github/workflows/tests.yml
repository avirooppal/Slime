name: CI checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docker,dashboard]"
      - name: Start disposable Docker Compose demo stack (Linux)
        if: runner.os == 'Linux'
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
      - run: python -m pytest -q -ra
      - run: python -m ruff check selfheal tests
      - run: python -m mypy selfheal --ignore-missing-imports
      - run: python -m pip check
      - name: Run Linux Docker trial script (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/linux_trial.sh
      - name: Stop disposable Docker Compose demo stack (Linux)
        if: always() && runner.os == 'Linux'
        run: docker compose down -v --remove-orphans
